<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153e3b"><title>车间工时记录</title><style>
body{margin:0;background:#f3f6f5;color:#172a28;font-family:system-ui,"Microsoft YaHei",sans-serif}header{background:#153e3b;color:white;padding:20px;font-size:22px;font-weight:bold}.wrap{max-width:900px;margin:auto;padding:14px}.panel,.record,.stat{background:white;border:1px solid #dce5e2;border-radius:13px;padding:13px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field label{display:block;font-size:13px;color:#647571;margin-bottom:5px}.field input,.field select{width:100%;box-sizing:border-box;min-height:43px;border:1px solid #cbd8d4;border-radius:8px;padding:9px;font-size:16px}button{border:0;border-radius:9px;padding:12px;margin:5px 4px 0 0;background:#17685d;color:white;font-weight:bold}.secondary{background:#e2f3ee;color:#15584f}.danger{background:#fff0f0;color:#a42c2c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat small{display:block;color:#647571}.stat strong{font-size:21px}.detail{font-size:13px;line-height:1.7;color:#4e625d}.search{width:100%;box-sizing:border-box;padding:11px;margin-bottom:10px;border:1px solid #dce5e2;border-radius:8px;font-size:15px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><header>车间工时记录<div style="font-size:12px;font-weight:normal;opacity:.8">现场登记 · 项目号下拉 · 本机保存 · Excel 导出</div></header><main class="wrap">
<div class="stats"><div class="stat"><small>记录条数</small><strong id="count">0</strong></div><div class="stat"><small>累计工时</small><strong id="total">0</strong></div><div class="stat"><small>记录日期</small><strong id="days">0</strong></div></div>
<section class="panel"><h3 id="formTitle">新增工时记录</h3><form id="form"><div class="grid">
<div class="field"><label>日期 *</label><input id="date" type="date" required></div><div class="field"><label>工人姓名 *</label><input id="name" list="names" required><datalist id="names"></datalist></div>
<div class="field"><label>项目号 *</label><input id="project" list="projects" required><datalist id="projects"></datalist></div><div class="field"><label>第几套（选填）</label><select id="setNo"></select></div>
<div class="field"><label>产品（选填）</label><input id="product" list="products"><datalist id="products"></datalist></div><div class="field"><label>部件（选填）</label><input id="part" list="parts"><datalist id="parts"></datalist></div><div class="field"><label>工序 *</label><input id="process" list="processes" required><datalist id="processes"></datalist></div>
<div class="field"><label>工时（小时，选填）</label><input id="hours" type="number" min="0.01" max="24" step="0.01" placeholder="可留空"></div><div class="field"><label>备注（选填）</label><input id="remark"></div></div><button id="save" type="submit">保存记录</button><button class="secondary" type="button" onclick="resetForm()">清空表单</button></form><p style="font-size:12px;color:#647571;line-height:1.6">第几套、产品、部件、工时均为选填项；工序为必填项。工时如填写，需大于 0 且不超过 24 小时。数据保存在当前浏览器中，请定期备份。</p></section>
<div class="panel"><b>按日期导出</b><div class="grid" style="margin-top:10px"><div class="field"><label>开始日期</label><input id="exportStart" type="date"></div><div class="field"><label>结束日期</label><input id="exportEnd" type="date"></div></div><button onclick="exportExcel()">导出所选日期</button><button class="secondary" onclick="exportAllExcel()">导出全部记录</button><button class="secondary" onclick="backup()">备份全部数据</button><button class="secondary" onclick="document.getElementById('file').click()">导入备份</button><input id="file" type="file" accept=".json" hidden></div><input id="search" class="search" placeholder="搜索姓名、项目号、产品、工序或日期"><div id="records"></div></main>
<script>
const D={"names": ["顾世尧", "朱文华", "张元飞", "丁树茂", "王磊", "李健", "葛严雷", "邢立魁", "周保云", "王维侠", "秦晓伟", "邓严顺", "孙志春", "方明忠", "张道明", "朱翔", "王克会", "张沿林", "宋钏", "吴军", "杨在飞", "王炳礼", "葛奕君", "朱彩兰", "刘乐义", "陆贝贝", "陆乐乐", "李朝江", "徐召", "褚东红", "方贺", "孙贺", "王刚刚", "滕杰", "徐赵兵", "吴满昌", "袁乃银", "高其伟", "韩克军", "朱扬扬", "关忠义", "李廷国", "周保友", "常淮北", "吴延成", "李珊珊", "韩乃亮", "任亮亮", "路传林", "周立艳", "戴丽娟", "顾芹芹", "刘二磊", "王奎", "武文超", "崔亮", "张娟娟", "尹仁来", "丁义", "方冠", "吴子猛", "李浩", "符布利", "姚波", "易二行", "黄建平", "顾宗泽", "吴子德", "吴延理", "李翔翔", "陈全友", "张成新", "郑小龙", "刘晓诗", "闫龙", "李二杰", "张广全", "周开洪", "蔡园素"], "sets": ["第1套", "第2套", "第3套"], "products": ["ESP备件", "地线支架", "公共作业", "过渡段", "烟道", "机电", "结构门", "静态模块", "喷吹模块", "冷却模块", "内部件", "灰斗", "预埋件", "吊篮"], "processes": ["下料", "清渣打磨", "校平校直", "铆接", "组焊", "修补打磨", "钻孔", "倒角", "绕线", "折弯", "激光切割", "预拼", "总拼", "总拼校正", "总拼后拆卸", "调试模具", "抹油打包包装", "加接引线", "引线接端子", "裁纸", "接线盒刷漆", "接线端子排安装", "接线盒盖安装", "粘纸圈", "转运", "修补批腻子", "喷漆", "喷砂", "搭平台", "法兰焊接", "灌胶", "卫生", "振打杆压头", "装车", "钝化", "质检", "清洗"], "parts": ["墙板", "法兰筋板", "筒体", "管撑", "横撑", "立柱", "框架", "格子框架", "绝缘子", "绝缘子盖板", "绝缘子底板", "三联弹簧座", "总拼平台", "多孔板", "槽形板", "三脚支架", "坡屋顶支撑板", "蝌蚪梁", "极板排", "振打器", "振打杆", "振打棒", "振打板", "高压支撑杆", "顶部框架", "浮动梁", "双锥连轴节", "振打定位件", "支撑板", "垫片", "垫块", "极线", "帆布支架", "门", "起重机", "拉杆", "联轴节", "阴极吊管", "保护筒", "吊耳", "集尘筒", "集尘筒底座", "振打座", "角钢", "抛杆", "自动泵油组件", "轴承座"],"projects":["251028", "252068", "261018", "262048", "267035", "267043", "262058", "261059", "261060", "262068", "261052", "232052", "251113", "261080", "261081", "261084", "261085", "262056", "261075", "262091", "262065", "262073", "26ESP备件", "公共/间接"]},KEY='workshop-hours-v1';let rows=JSON.parse(localStorage.getItem(KEY)||'[]'),editing=null;
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function list(id,a){$(id).innerHTML=a.map(x=>`<option value="${esc(x)}"></option>`).join('')}function sel(id,a){$(id).innerHTML='<option value="">请选择</option>'+a.map(x=>`<option>${esc(x)}</option>`).join('')}
list('names',D.names);list('projects',D.projects);list('products',D.products);list('parts',D.parts);list('processes',D.processes);sel('setNo',D.sets);
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}$('date').value=today();
function persist(){localStorage.setItem(KEY,JSON.stringify(rows));render()}
function resetForm(){editing=null;$('form').reset();$('date').value=today();$('formTitle').textContent='新增工时记录';$('save').textContent='保存记录'}
$('form').onsubmit=e=>{e.preventDefault();let hv=$('hours').value.trim();let prior=editing?rows.find(x=>x.id===editing):null;let r={id:editing||Date.now().toString(36)+Math.random().toString(36).slice(2),createdAt:prior?.createdAt||new Date().toISOString(),date:$('date').value,name:$('name').value.trim(),project:$('project').value.trim(),setNo:$('setNo').value,product:$('product').value.trim(),part:$('part').value.trim(),process:$('process').value.trim(),hours:hv===''?'':Number(hv),remark:$('remark').value.trim()};if(!r.date||!r.name||!r.project||!r.process||(hv!==''&&(!(r.hours>0)||r.hours>24))){alert('请检查必填项；第几套可留空。如填写工时，需大于0且不超过24小时。');return}if(editing)rows=rows.map(x=>x.id===editing?r:x);else rows.unshift(r);persist();resetForm()};
function render(){let q=$('search').value.toLowerCase(),filtered=rows.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q));$('count').textContent=rows.length;$('total').textContent=rows.reduce((s,r)=>s+(Number(r.hours)||0),0).toFixed(2).replace(/\.?0+$/,'');$('days').textContent=new Set(rows.map(r=>r.date)).size;$('records').innerHTML=filtered.length?filtered.map(r=>`<article class="record"><b>${esc(r.name)} · ${esc(r.project)}</b> <span style="float:right;background:#e2f3ee;padding:4px 8px;border-radius:20px">${r.hours===''||r.hours==null?'未填写':esc(r.hours)+' 小时'}</span><div class="detail">${esc(r.date)}　|　${esc(r.setNo)}${r.product?'<br>产品：'+esc(r.product):''}${r.part?'<br>部件：'+esc(r.part):''}<br>工序：${esc(r.process)}${r.remark?'<br>备注：'+esc(r.remark):''}</div><button class="secondary" onclick="editRow('${r.id}')">编辑</button><button class="danger" onclick="delRow('${r.id}')">删除</button></article>`).join(''):'<p style="text-align:center;color:#647571">暂无工时记录</p>'}
window.editRow=id=>{let r=rows.find(x=>x.id===id);editing=id;['date','name','project','setNo','product','part','process','hours','remark'].forEach(k=>$(k).value=r[k]??'');$('formTitle').textContent='编辑工时记录';$('save').textContent='保存修改';scrollTo(0,0)};window.delRow=id=>{if(confirm('确定删除这条记录？')){rows=rows.filter(x=>x.id!==id);persist()}};$('search').oninput=render;
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function makeExcel(data,filename){
if(!data.length){alert('所选日期范围内没有记录');return}
const cols=[['日期','date'],['人名','name'],['项目号','project'],['第几套','setNo'],['产品','product'],['部件','part'],['工序','process'],['工时（小时）','hours'],['备注','remark']];
const escXml=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
const colName=n=>{let x='';while(n){let r=(n-1)%26;x=String.fromCharCode(65+r)+x;n=Math.floor((n-1)/26)}return x};
let sorted=data.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||((a.createdAt||'').localeCompare(b.createdAt||'')));
let sheetRows='<row r="1">'+cols.map((c,i)=>'<c r="'+colName(i+1)+'1" t="inlineStr" s="1"><is><t>'+escXml(c[0])+'</t></is></c>').join('')+'</row>';
sorted.forEach((r,ri)=>{let rn=ri+2;sheetRows+='<row r="'+rn+'">'+cols.map((c,i)=>{let v=r[c[1]];let ref=colName(i+1)+rn;if(c[1]==='date'&&v){let serial=Math.round((Date.parse(String(v).slice(0,10)+'T00:00:00Z')-Date.UTC(1899,11,30))/86400000);return '<c r="'+ref+'" s="2"><v>'+serial+'</v></c>'}if(c[1]==='hours'&&v!==''&&v!==null&&v!==undefined&&Number.isFinite(Number(v)))return '<c r="'+ref+'"><v>'+Number(v)+'</v></c>';return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+escXml(v==null?'':v)+'</t></is></c>'}).join('')+'</row>'});
const files={
'[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>',
'_rels/.rels':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
'xl/workbook.xml':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="工时记录" sheetId="1" r:id="rId1"/></sheets></workbook>',
'xl/_rels/workbook.xml.rels':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
'xl/styles.xml':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="等线"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="等线"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF17685D"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><numFmts count="1"><numFmt numFmtId="164" formatCode="yyyy/mm/dd"/></numFmts><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>',
'xl/worksheets/sheet1.xml':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="18"/><cols><col min="1" max="1" width="13" customWidth="1"/><col min="2" max="2" width="16" customWidth="1"/><col min="3" max="3" width="18" customWidth="1"/><col min="4" max="4" width="12" customWidth="1"/><col min="5" max="7" width="18" customWidth="1"/><col min="8" max="8" width="14" customWidth="1"/><col min="9" max="9" width="24" customWidth="1"/></cols><sheetData>'+sheetRows+'</sheetData><autoFilter ref="A1:I'+(sorted.length+1)+'"/></worksheet>'
};
const enc=new TextEncoder();let crcTable=null;function crc32(bytes){if(!crcTable){crcTable=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;crcTable[n]=c>>>0}}let c=0xffffffff;for(let b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return (c^0xffffffff)>>>0}
const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];let local=[],central=[],offset=0;
for(const [name,content] of Object.entries(files)){let nb=enc.encode(name),dataBytes=enc.encode(content),crc=crc32(dataBytes);let lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(dataBytes.length),...u32(dataBytes.length),...u16(nb.length),...u16(0),...nb]);local.push(lh,dataBytes);let ch=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(dataBytes.length),...u32(dataBytes.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...nb]);central.push(ch);offset+=lh.length+dataBytes.length}
let centralSize=central.reduce((a,b)=>a+b.length,0),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(central.length),...u16(central.length),...u32(centralSize),...u32(offset),...u16(0)]);let parts=[...local,...central,end];download(new Blob(parts,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),filename.replace(/\.(xls|csv)$/i,'.xlsx'));
}
function exportExcel(){let start=$('exportStart').value,end=$('exportEnd').value;if(start&&end&&start>end){alert('开始日期不能晚于结束日期');return}if(!start&&!end){alert('请至少选择开始日期或结束日期；如需导出全部，请点击“导出全部记录”。');return}let data=rows.filter(r=>(!start||r.date>=start)&&(!end||r.date<=end));makeExcel(data,'车间工时记录_'+(start||'起始')+'_至_'+(end||'截至')+'.xlsx')}
function exportAllExcel(){makeExcel(rows,'车间工时记录_全部_'+today()+'.xlsx')}
function backup(){download(new Blob([JSON.stringify({version:1,records:rows},null,2)],{type:'application/json'}),'车间工时备份_'+today()+'.json')}
$('file').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text()),a=Array.isArray(d)?d:d.records;if(!Array.isArray(a))throw 0;if(confirm('导入 '+a.length+' 条记录？重复编号将覆盖。')){let m=new Map(rows.map(r=>[r.id,r]));a.forEach((r,i)=>m.set(r.id||'imp'+i,r));rows=[...m.values()];persist()}}catch(e){alert('备份文件格式不正确')}e.target.value=''};
render();
</script></body></html>
